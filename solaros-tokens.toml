# ===========================================================================
# Grounds
# ---------------------------------------------------------------------------
# Three. Every role is resolved per ground rather than once, because a colour
# that carries on ink does not carry on paper and the reverse.
#
# STATE CHANGE HOLDS HUE. Hover and press move lightness only, always away from
# the ground. On ink that means going lighter; on paper, darker. A control
# changes state, not colour.
# ===========================================================================

# ---------------------------------------------------------------------------
[ground.ink]
# The default ground.
bg          = "#0A0A0B"
bg_elevated = "#111113"

# Revised 2026-09-03 by ruling F1. The greys moved from 286deg to 293deg in
# OKLCh and roughly doubled in chroma, so they lean toward the violet rather
# than sitting neutral. text_muted is the one that had to move: every mono
# label runs at 10-12px on it, and the old value was 3.90:1 there.
text        = "#F6F6F4"   # 18.29:1 — the paper literal. The estate has one white
text_dim    = "#B4B2BF"   #  9.48:1
text_muted  = "#7C7A89"   #  4.71:1 — clears the text floor, unlike its predecessor
rule        = "rgba(255, 255, 255, 0.10)"   # alpha, so it composites on any ground

# The accent needs two values here: brand violet is 3.26:1 on ink and cannot
# carry text, but is fine as a FILL where the label is white at 6.07:1. — A1
accent       = "#9078FF"   # 5.95:1 — text, links, focus, key numerals
accent_solid = "#6C3EE5"   # fills, labelled with on_accent
on_accent    = "#FFFFFF"   # 6.07:1 on accent_solid
accent_hov   = "#7449F0"   # OKLCh L +0.03 — label 5.31:1
accent_prs   = "#7C54FA"   # OKLCh L +0.06 — label 4.66:1
accent_dim   = "#6F67AB"   # 3.96:1 — subtle accent fills
accent_10    = "rgba(144, 120, 255, 0.10)"

# The brand mark. Same colour as accent_solid, kept separate on purpose: "the
# mark is violet" and "a button is filled violet" are two decisions, and only
# the second answers to a contrast requirement.
mark         = "#6C3EE5"
mark_press   = "#4C1CCC"   # ramp.violet 600
on_mark      = "#FFFFFF"   # 6.07:1

alt          = "#4BCDE7"   # 10.54:1 — the second voice in artwork, A4
# No link role. Indigo is artwork only — A3. Marking an external call is
# OPEN-1 and is not a colour decision until it is ruled to be one.

error        = "#ff8a8a"   # 8.72:1
error_10     = "rgba(255, 138, 138, 0.10)"
warn         = "#F0B95E"   # 11.13:1
warn_10      = "rgba(240, 185, 94, 0.10)"
good         = "#74E08C"   # 12.05:1
good_10      = "rgba(116, 224, 140, 0.10)"

# Kept as approved values. Teal must NOT be used beside `alt`: 30.5deg apart, and
# at 1px and 16% opacity the pair reads as one colour. See DECISIONS.md OPEN-1.
teal         = "#5FD2C2"
teal_10      = "rgba(95, 210, 194, 0.10)"
pink         = "#F582B7"
pink_10      = "rgba(245, 130, 183, 0.10)"

[ground.ink.mark_roles]
# Full-strength marks drawn ON the ground. dm-visual's vocabulary. — E2
line = "#F5F5F5"
mid  = "#A1A1A6"
hot  = "#9078FF"   # resolves to the ground's accent — A6

[ground.ink.texture]
# Near-ground texture that sits just ABOVE the ground and reads as material
# rather than as a drawn line. A different register from mark_roles, not a
# second name for it. — E2
grid      = "#16161B"   #  4.68 L* above ink
node      = "#0E0E12"
node_live = "#11111F"
lattice   = "#23232A"
dot_dim   = "#3A3A40"

[ground.ink.syntax]
# E1. Deliberately NOT the accent: the accent means "this figure is about this"
# and is spent once; syntax means "this is what kind of word this is" and repeats.
comment = "#6E6E73"
keyword = "#8F9BD6"
type    = "#5FD2C2"
