# ===========================================================================
# Type
# ===========================================================================
[type]
family_sans    = "Inter"
family_mono    = "JetBrains Mono"
family_display = "Zalando Sans Expanded"

display_default = "sans"      # B1 — headings are Inter
display_opt_in  = true        # a surface turns the display face on deliberately
display_rule    = """
Once per page on composed graphics: one element, the largest one. A second use
makes it a body face and it is not one. On the web the opt-in is an attribute,
which also stops the layout requesting the face unless a page asks for it."""

# Michroma is NOT a Solaros face — B2.

[type.scale.web]
# px, with matched line height. Unchanged from the shipped web scale.
xs   = [12, 16]
sm   = [14, 20]
base = [16, 24]
lg   = [18, 28]
xl   = [20, 28]
"3xl" = [30, 36]
"4xl" = [36, 40]
"6xl" = [60, 60]
"7xl" = [72, 72]

[type.scale.canvas]
# Fixed 1920x1080 surfaces: decks and video frames.
#
# GUIDED, NOT GOVERNED — the difference from the web scale above, and the whole
# of ruling B3b. On the web a scale is a constraint: dozens of components across
# hundreds of pages, nobody can see them all at once, so the only thing stopping
# drift is that an unlisted size cannot be used, and lint enforces it. On a fixed
# canvas one person composes one frame and can see the whole of it. A 2px nudge
# for balance is the work, not drift.
#
# So: start on a step. Depart when the composition asks for it. A departure is a
# design decision, not a violation, and nothing lints it.
#
# Derived from 257 measured uses across the deck templates and the video frames.
# Against this ladder, 149 of those sit unchanged, 74 move by 5% or less, and 34
# move further — 23 of the 34 being one-off display sizes on single slides, which
# is the case this ruling exists to permit.
steps = [14, 19, 22, 24, 27, 30, 34, 42, 54, 72, 90, 120, 160]

# NOT a multiple of the web scale, and the attempt is recorded because it is the
# obvious thing to try. Web x1.5 moves 31% of measured uses: the canvas working
# range, 19 to 34, falls inside a gap the web scale skips entirely (20 -> 30),
# and 14px deck chrome does not scale with the canvas because it is already at a
# legibility floor. The two ladders share 14, 30 and 72 and diverge elsewhere for
# that reason.
relation_to_web = "shares 14 / 30 / 72; not a multiple. See DECISIONS.md B3b"

[type.scale.canvas.roles]
# What each step is FOR, from what the measured uses were doing. A starting point
# for a new piece, not an allocation.
chrome    = 14    # footers, wordmark lockup lines
label     = 19    # mono eyebrows, small caps
mono      = 22    # the largest single cluster, 45 uses
body      = 24    # the second largest, 41 uses
body_lg   = 27
lead      = 30
lead_lg   = 34
sub       = 42
display   = 54
headline  = 72
headline_lg = 90
statement = 120
statement_lg = 160

[type.weight]
