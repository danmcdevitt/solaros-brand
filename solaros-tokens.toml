# ===========================================================================
# Drafting
# ---------------------------------------------------------------------------
# Line weights for technical drawing — exploded views, construction lines,
# state graphs, the dispatcher plate. Ruling F3.
#
# ONE INK, THREE WEIGHTS. A drawing is not coloured; it is weighted. Every
# structural line is the same ink and separates by width, opacity and dash.
# That is the same argument the violet ground already makes for type — emphasis
# by weight, not by a second colour — applied to line.
#
# Widths are SVG stroke-width in the drawing's own units, so a drawing scaled
# by a wrapper keeps its weight relationships. Dash arrays are the drafting
# conventions: short dashes for a hidden edge, long-short-short for a centre
# line, both read by anyone who has seen an engineering drawing.
# ===========================================================================
[drafting]
ink = "accent"          # the structural ink on ink and paper grounds
note = """
Annotation is the exception and is deliberate: a dimension line and its text
are text_dim, never the accent. A dimension measures the subject, it is not the
subject, and giving it the accent would spend the accent on a ruler."""

[drafting.structure]
# The four structural weights. Opacity is applied to the ink named above.
visible = { width = 1.1, opacity = 1.00 }
thin    = { width = 0.6, opacity = 0.55 }
hidden  = { width = 0.7, opacity = 0.45, dash = "5 3" }
centre  = { width = 0.6, opacity = 0.40, dash = "14 3 2 3" }

[drafting.structure_on_violet]
# The violet ground takes white as its ink, at lower alphas — white on violet
# reads stronger than the accent on ink, so the same visual weight needs less.
# There is no hidden weight here; nothing on this ground is quiet enough to
# carry a dashed edge as well.
ink     = "#FFFFFF"
visible = { width = 1.1, opacity = 1.00 }
thin    = { width = 0.6, opacity = 0.45 }
centre  = { width = 0.6, opacity = 0.35, dash = "14 3 2 3" }

[drafting.annotation]
# Measurement and engraving. Sizes are px in the drawing's own units.
dimension_line = { ink = "text_dim", width = 0.7 }
dimension_text = { ink = "text_dim", size = 9.0, tracking = "1px" }
engraving      = { ink = "accent", opacity = 0.80, size = 7.5, tracking = "2.2px" }
engraving_on_violet = { ink = "#FFFFFF", opacity = 0.95, size = 7.5, tracking = "2.2px" }

[drafting.motion]
# Explode and assemble. Assembled it is one thing; exploded it shows its parts,
# each with a leader to what it is. Reduced motion settles with NO travel rather
# than snapping — the parts simply arrive where they belong.
duration = "900ms"
ease     = "cubic-bezier(0.16, 1, 0.3, 1)"
reduced_motion = "settle with no travel"

[drafting.lit]
# The same one-light rule as the shadow ladder, carried into 3D. The fill light
# is the ACCENT, which is why a rendered part reads as Solaros rather than as a
# generic grey render.
key     = { colour = "#FFFFFF", intensity = 1.10, position = [3, 6, 4] }
fill    = { colour = "#9078FF", intensity = 0.35, position = [-4, -1, -3] }
ambient = { colour = "#FFFFFF", intensity = 0.22 }
surface = { metalness = 0.78, roughness = 0.46 }

# ===========================================================================
# Series palette
# ---------------------------------------------------------------------------
# For multi-series charts where several entities must be told apart. Never for
# emphasis — violet owns that.
#
# INCOMPLETE BY DECISION, NOT BY OVERSIGHT. A3 scoped indigo to links, which
# vacated series-1; A4 recorded teal as unusable beside cyan, which contests
# series-2. Neither replacement is derivable from what has been ruled.
# ===========================================================================
[series]
status = "open"
see    = "DECISIONS.md OPEN-1"

[series.settled]
# These three are unaffected by any ruling.
"3" = { ink = "#74E08C", paper = "#74E08C" }
"4" = { ink = "#F0B95E", paper = "#F0B95E" }
"5" = { ink = "#F582B7", paper = "#F582B7" }


# ===========================================================================
# Elevation
# ---------------------------------------------------------------------------
# C1. One light, from above, committed to across a surface. A raised object shows
# a hair of highlight on its top edge, an edge that is a spread-only shadow at
# low alpha rather than an opaque border, and a stack below that tightens at the
# contact and softens as it falls away — each layer doubling offset and blur and
# pulling spread further negative.
# ===========================================================================
[shadow.ink]
panel = """
0 1px 2px rgba(10, 10, 11, 0.16),
0 12px 32px -8px rgba(10, 10, 11, 0.28)"""
raised = """
inset 0 1px 0 rgba(255, 255, 255, 0.06),
0 0 0 1px rgba(255, 255, 255, 0.06),
0 1px 1px -0.5px rgba(0, 0, 0, 0.40),
0 3px 3px -1.5px rgba(0, 0, 0, 0.36),
0 6px 6px -3px rgba(0, 0, 0, 0.32),
0 12px 12px -6px rgba(0, 0, 0, 0.28),
0 24px 24px -12px rgba(0, 0, 0, 0.24)"""

[shadow.violet]
# The highlight and edge step up, since white on violet reads at a lower alpha
# than white on ink. The stack stays neutral ink so it does not vanish.
raised = """
inset 0 1px 0 rgba(255, 255, 255, 0.22),
0 0 0 1px rgba(255, 255, 255, 0.22),
0 1px 1px -0.5px rgba(10, 10, 11, 0.30),
0 3px 3px -1.5px rgba(10, 10, 11, 0.26),
0 6px 6px -3px rgba(10, 10, 11, 0.22),
0 12px 12px -6px rgba(10, 10, 11, 0.18),
0 24px 24px -12px rgba(10, 10, 11, 0.14)"""


# ===========================================================================
# Atmosphere
# ---------------------------------------------------------------------------
# Ground, then atmosphere, then content. A STACK, bottom first.
#
# What is ABSENT is a decision: no vignette, no wash, no field. Auras and grids
# were ours, not the brand's, and leaving them out of the stack says so where a
# comment could not.
# ===========================================================================
[atmosphere]
flat_ground = true
opt_in      = true   # belongs to a surface, not to the document

[[atmosphere.layer]]
kind = "dust"
tint = "line"

[[atmosphere.layer]]
kind = "grain"

[atmosphere.grain]
# D1. One opacity is not one effect: soft-light does most of its work at mid
# luminance and almost none near white, so a light ground takes multiply, and a
# chromatic ground sits in the middle of soft-light's range and takes far less.
tile      = "180px"
ink       = { blend = "soft-light", opacity = 0.62 }
paper     = { blend = "multiply",   opacity = 0.12 }
violet    = { blend = "soft-light", opacity = 0.17 }

[atmosphere.dust]
# D2. Derived from area so no caller silently picks its own number. A surface may
# pin a count WITH THE REASON ON RECORD.
formula   = "max(120, round(w * h * 260 / (1080 * 1350)))"
seed      = 11
ground    = "ink"          # dark grounds only
radii     = [0.6, 0.7, 0.9, 1.0, 1.3, 1.7]
opacity   = [0.05, 0.34]   # scaled by 0.45 + 0.55 * (y / h)
bias      = "denser toward the lower right"
arcs      = 2              # two very large faint arcs stop it reading as scattershot

[[atmosphere.dust.override]]
surface = "solaros.uk hero"
count   = 520
reason  = """
The formula gives about 180 at this size. 520 would be busy under a page of body
copy; over a hero it is the point. Prominence comes from the dust count, not from
raising grain — grain is a wash and pushing it greys the whole surface."""


# ===========================================================================
