50 = "#F9F9F8"
100 = "#F9F9F8"
200 = "#F8F8F7"
300 = "#F7F7F6"
400 = "#F7F7F5"
500 = "#F6F6F4"
600 = "#C8C8BB"
700 = "#999982"
800 = "#636351"
900 = "#2A2A23"

[ramp.violet]
# 500 is the brand mark, 600 is the press state
50 = "#F6F4FD"
100 = "#E7E0FB"
200 = "#C8B7F5"
300 = "#AA8FF0"
400 = "#8B66EA"
500 = "#6C3EE5"
600 = "#4C1CCC"
700 = "#391598"
800 = "#250E64"
