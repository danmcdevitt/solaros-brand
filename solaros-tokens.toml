# For discrete bands, overlapping layers and charts — where an exact, opaque,
# ground-specific step is wanted.
#
# For fades, auras and washes use alpha instead: one declaration composites
# correctly on either ground.
# ===========================================================================
[ramp.ink]
# compresses hard past 500 — near-blacks only
50 = "#F8F8F9"
100 = "#DDDDE0"
200 = "#A5A5AD"
300 = "#6F6F7A"
400 = "#3C3C42"
500 = "#0A0A0B"
600 = "#0A0A0C"
700 = "#0B0B0C"
800 = "#0B0B0D"
900 = "#0C0C0D"

[ramp.paper]
