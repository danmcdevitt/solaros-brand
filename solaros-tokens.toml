const   = "#C8A86A"
string  = "#7FB08A"

# ---------------------------------------------------------------------------
[ground.paper]
bg          = "#F6F6F4"   # paper, not white — warmer than #FFF
bg_elevated = "#FFFFFF"
text        = "#16161A"   # 16.68:1
text_dim    = "#55555C"   #  6.83:1
# UNDER THE TEXT FLOOR AND KNOWN. 3.17:1, so mono labels at 10-12px are
# illegal on this ground — the same defect F1 fixed on ink, which F1 did not
